<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- [크리 260824 S149c] 브라우저 자동번역 차단.
     크롬이 이 판을 번역하면서 HANGSENG 을 "매달린 노래" 로,
     $16,143.40 을 "16,143.40달러" 로 바꿔놨다. 게다가 3초마다
     카드를 다시 그리니 번역기가 매번 다시 달라붙어 화면이 흔들렸다.
     방송용 판에서 종목명과 금액이 번역되면 그건 그냥 오표기다. -->
<meta name="google" content="notranslate">
<title>해외선물 자동매매 실황 · 실전 &amp; 모의 · Pro-man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0E14; --ink2:#0E131C; --panel:#141A24;
    --hair:rgba(255,255,255,.08);
    --hi:#EAF0FA; --mu:#AAB6C6; --mu2:#7C8A9C;
    --up:#2BD98E; --down:#FF5C6C; --gold:#E8B65A; --gold2:#C8923A;
    --real:#FFC24B; --real2:#D9942E;
    --demo:#5B7287; --demo2:#3C4C5C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#05070B;overflow:hidden;font-family:'IBM Plex Sans KR','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:'IBM Plex Sans KR','Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;letter-spacing:.005em}
  /* [크리 260818 3차] IBM Plex Sans KR 로 확정 (주인님 선택).
     JetBrains Mono = 0 안에 점 · Roboto Mono = 0 안에 빗금.
     고정폭 서체는 0 을 일부러 표시하는 게 설계라 이 화면에 안 맞는다.
     tabular-nums 로 자릿수만 맞추고 글자꼴은 본문과 한 가족으로 간다. */
  .clock.mono,.clock.mono .z{font-weight:700}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{width:1920px;height:1080px;flex:none;transform-origin:center center;
    background:linear-gradient(180deg,#0B0E14,#080B11 60%,#06080D);
    position:relative;overflow:hidden;color:var(--hi);padding:12px 46px 14px;display:flex;flex-direction:column;gap:10px}

  .hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;position:relative;z-index:2}
  .hdr .left{display:flex;flex-direction:column;gap:4px}
  .eyebrow{display:flex;align-items:center;gap:14px;color:var(--gold);font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .eyebrow .bar{width:42px;height:3px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px}
  .title{font-size:38px;font-weight:700;line-height:1.02;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 30px rgba(232,182,90,.18)}
  .title .by{color:var(--gold);font-weight:700}
  .u{display:block;height:4px;width:100%;margin-top:5px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2) 22%,transparent 60%)}
  .hdr .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
  .live{display:flex;align-items:center;gap:8px;background:rgba(255,92,108,.10);border:1px solid rgba(255,92,108,.35);padding:4px 12px;border-radius:999px}
  .live .dot{width:9px;height:9px;border-radius:50%;background:var(--down);animation:pulse 1.6s infinite}
  .live .txt{font-weight:600;letter-spacing:.12em;font-size:16px;color:#fff}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,92,108,.55)}70%{box-shadow:0 0 0 14px rgba(255,92,108,0)}100%{box-shadow:0 0 0 0 rgba(255,92,108,0)}}
  .datebox{font-size:25px;font-weight:700;color:var(--gold)}
  .daycnt{display:inline-block;vertical-align:middle;margin-left:18px;font-size:30px;font-weight:800;line-height:1;color:#1a1710;background:linear-gradient(180deg,#FFD47A,#E8B65A);border-radius:999px;padding:8px 20px;letter-spacing:.01em;box-shadow:0 2px 18px rgba(232,182,90,.35)}  /* [S1029 261021] 제목 옆 · 크게 */
  .daycnt .since{font-size:17px;font-weight:600;opacity:.75;margin-right:12px;letter-spacing:0}  /* [S1030] 시작일 같이 */
  .clock{font-size:35px;font-weight:600;line-height:1}
  .clock .z{color:var(--mu);font-size:15px;font-weight:600;margin-left:10px;letter-spacing:.08em}
  .byline{font-size:16px;color:var(--mu);font-weight:600;margin-top:1px}
  .byline b{color:var(--gold);font-weight:700;font-size:19px}

  .body{display:grid;grid-template-columns:1fr 410px;gap:16px;flex:1;min-height:0;position:relative;z-index:2}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}

  .zone{position:relative;border-radius:20px;padding:10px 11px 12px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden}
  .zone.real{background:radial-gradient(120% 80% at 50% -10%,rgba(255,194,75,.16),transparent 60%),linear-gradient(165deg,#33260C,#1B1206 72%);
    border:3px solid var(--real);box-shadow:0 0 60px rgba(255,194,75,.22)}
  .zone.demo{background:linear-gradient(165deg,#141C26,#0B121A 72%);border:3px solid rgba(91,114,135,.45)}
  .zone .wm{position:absolute;font-weight:700;pointer-events:none;z-index:0;white-space:nowrap;letter-spacing:.04em}
  .zone.real .wm{font-size:230px;color:rgba(255,194,75,.07);transform:rotate(-16deg);top:34%;left:-4%}
  .zone.demo .wm{font-size:200px;color:rgba(140,170,200,.085);transform:rotate(-16deg);top:30%;left:-6%}
  .zone>*{position:relative;z-index:1}

  .zhead{display:flex;align-items:center;gap:12px;padding:8px 18px;border-radius:14px;font-weight:700}
  .zhead .zic{font-size:25px;line-height:1}
  .zhead .zt{display:flex;flex-direction:column;gap:1px}
  .zhead .zk{font-size:34px;letter-spacing:.01em;line-height:1}
  .zhead .ze{font-size:15px;font-weight:600;letter-spacing:.18em}
  .zhead .zwarn{margin-left:auto;font-size:19px;font-weight:700;padding:5px 14px;border-radius:999px}
  .zone.real .zhead{background:linear-gradient(90deg,var(--real),var(--real2));color:#1B1206}
  .zone.real .zhead .ze{color:#4A340F}
  .zone.real .zhead .zwarn{background:rgba(27,18,6,.28);color:#1B1206;border:1px solid rgba(27,18,6,.35)}
  .zone.demo .zhead{background:linear-gradient(90deg,#2A3848,#1A2532);color:#AFC2D6;border:1px solid rgba(120,145,170,.3)}
  .zone.demo .zhead .ze{color:#7C90A6}
  .zone.demo .zhead .zwarn{background:rgba(120,145,170,.14);color:#AFC2D6;border:1px solid rgba(120,145,170,.32)}

  .zcards{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}

  /* [크리 261017 S878] 왼쪽 열 = 실전 테두리 4칸 + 테두리 밖 1칸(전략13호).
     4:1 로 높이를 나눠 오른쪽 5칸과 칸 크기가 같아진다. gap 18px 은 .board 와 맞춤. */
  .realcol{display:flex;flex-direction:column;gap:18px;min-height:0}
  .realcol .zone.real{flex:4;min-height:0}
  .realcol .zone.demo.solo{flex:1;min-height:0;padding:9px 11px}

  /* [크리 260711] 5행 그리드.
     - 카드 글자: container query(cqh) = 카드 높이 비례 → 행 수 바뀌어도 자동 맞춤.
     - 카드 여백: .cin 래퍼에 px 고정 (cq 단위는 자기 자신에 안 먹어서 px 로 확실히). */
  .acard{flex:1;min-height:0;container-type:size;border-radius:16px;display:flex;flex-direction:column;
    position:relative;overflow:hidden;padding:0;gap:0;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  .cin{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 26px 12px 32px}
  .acard .accent{position:absolute;left:0;top:0;bottom:0;width:6px}
  .zone.real .acard{background:linear-gradient(180deg,rgba(255,210,120,.10),rgba(0,0,0,.32));border:2px solid rgba(255,194,75,.5)}
  .zone.real .acard .accent{background:linear-gradient(180deg,var(--real),var(--real2))}
  .zone.demo .acard{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.28));border:2px solid rgba(91,114,135,.32)}
  .zone.demo .acard .accent{background:linear-gradient(180deg,var(--demo),var(--demo2))}

  /* [크리 260713] 포지션 칩이 추가돼 가로가 빡빡해짐 → 간격을 조여 자리를 만든다.
     계좌명(.nm)은 flex 로 줄어들며 말줄임 처리되므로 깨지지 않는다. */
  .acard .chead{display:flex;align-items:center;justify-content:space-between;gap:9px;min-width:0}
  .acard .nm{display:flex;align-items:baseline;gap:8px;flex:1 1 auto;min-width:0;overflow:hidden}
  /* [크리 261019 S941] 주인님 지시 ①"전략00호와 브로커명 사이에 종목을 넣자(1종목만 도는 1·9·10·13호)"
     ②"1행 간격을 잘 조정해 시인성·가독성이 떨어지지 않게 — 두 번 손 안 대게".
     고친 생각: 글자를 똑같이 줄이면 다 같이 안 보인다. **중요한 순서대로 크기를 준다.**
       별명(누구) > 종목(무엇) > 브로커(어디)   ← 브로커가 제일 안 중요한데 전엔 별명과 같은 크기였다
     그래서 별명은 13.5cqh 로 되돌리고, 종목은 금색 0.80em, 브로커는 0.74em·흐리게로 내렸다.
     ★[메모리 규칙 261019] "칸 글씨 크기는 전역값(이름 13.5cqh)을 건드리지 않는다" —
     알약(시드·포지션·일차)과 간격은 **원래대로 두었다**. 자리는 브로커 글씨를 낮춰서 만든다. */
  .acard .name{font-size:23px;font-size:13.5cqh;font-weight:700;white-space:nowrap;line-height:1;letter-spacing:-.008em;overflow:hidden;text-overflow:ellipsis}
  .acard .name .syml{font-style:normal;font-weight:700;font-size:.80em;letter-spacing:.01em;color:var(--gold);opacity:.95;padding:0 .14em}
  .acard .name .brk{font-style:normal;font-weight:600;font-size:.74em;letter-spacing:0;color:var(--mu);opacity:.85}
  /* [크리 261019 S941] ★메모리 규칙대로 — 전역을 건드리지 않고 **종목이 붙은 칸만** 알약을 한 단 양보시킨다.
     (261019 에 두 번 틀렸던 자리: 전체 글씨를 줄여 "다 작아졌잖아" 소리를 들었다. 같은 실수 금지)
     실측: 알약을 원래 크기로 두면 1·9·10·13호 네 칸이 전부 말줄임(…)이 났다 → 그 네 칸만 줄인다. */
  .acard.withsym .chead{gap:7px}
  .acard.withsym .seedpill{font-size:21px;font-size:13.2cqh;padding:3px 11px}
  .acard.withsym .pospill,
  .acard.withsym .weekpill{font-size:20px;font-size:12.6cqh}
  .zone.real .name{color:#fff} .zone.demo .name{color:#DCE7F2}
  .acard .tag{font-size:16px;font-size:10cqh;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
  .zone.real .tag{color:#1B1206;background:var(--real)}
  .zone.demo .tag{color:#9FB3C8;background:rgba(120,145,170,.16);border:1px solid rgba(120,145,170,.4)}
  .acard .seedpill{font-size:24px;font-size:15cqh;font-weight:700;color:var(--mu);background:rgba(255,255,255,.05);
    border:1px solid var(--hair);border-radius:999px;padding:3px 14px;white-space:nowrap;line-height:1;flex:none}
  .acard .seedpill b{color:#fff}

  /* [크리 260713] 현재 보유 포지션 수 — 계좌명과 시드 사이. 실시간(3초 폴링).
     0개 = 조용히, 1개 이상 = 강조. 노출 상태가 한눈에 보이게. */
  .acard .pospill{font-size:22px;font-size:14cqh;font-weight:700;color:var(--mu);
    background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:999px;
    padding:3px 13px;white-space:nowrap;line-height:1;flex:none}
  .acard .pospill b{color:#fff}
  /* [크리 260713] 색 바탕에 어두운 글자는 글자가 파인 것처럼 보인다.
     → 바탕은 어둡게 두고 '글자에만' 색을 입힌다 (⚡실전 태그와 같은 결). */
  .zone.real .acard .pospill.on{color:var(--real);background:rgba(255,194,75,.10);
    border-color:rgba(255,194,75,.55)}
  .zone.real .acard .pospill.on b{color:var(--real)}
  .zone.demo .acard .pospill.on{color:#A9C0D6;background:rgba(140,170,200,.10);
    border-color:rgba(140,170,200,.45)}
  .zone.demo .acard .pospill.on b{color:#D2E2F0}

  /* ─── [크리 261017 S874] 실전 칸에 앉은 '모의' 계좌 — 색만 모의로 ───
     왜: 데모 칸(1~5)이 꽉 차서 전략13호를 real-5 자리에 넣었는데(S835),
         그 자리에 앉으면 .zone.real 색(황금)이 입혀져 실전처럼 보인다.
         주인님 지시 261017 "모의가 6개야 … 그걸 모의 컬러로 바꿔줘".
     어떻게: MAP 에 demoLook:true 를 적으면 카드에 .asdemo 가 붙고
             아래 규칙이 .zone.demo 와 똑같은 색으로 되돌린다. 자리는 그대로.
     되돌리기: MAP 의 demoLook 줄 삭제 (CSS 는 남아도 무해) */
  .zone.real .acard.asdemo{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.28));
    border:2px solid rgba(91,114,135,.32)}
  .zone.real .acard.asdemo .accent{background:linear-gradient(180deg,var(--demo),var(--demo2))}
  .zone.real .acard.asdemo .name{color:#DCE7F2}
  .zone.real .acard.asdemo .tag{color:#9FB3C8;background:rgba(120,145,170,.16);
    border:1px solid rgba(120,145,170,.4)}
  .zone.real .acard.asdemo .pospill.on{color:#A9C0D6;background:rgba(140,170,200,.10);
    border-color:rgba(140,170,200,.45)}
  .zone.real .acard.asdemo .pospill.on b{color:#D2E2F0}
  .zone.real .acard.asdemo .cell .cv{color:#C8D6E4}

  /* [크리 260714→261019 S942] 매매 착수 후 N일차 — 포지션 칩 왼쪽.
     서버가 config/strategy_start.json 을 읽어 매일 자동 갱신한다.
     가상매매 검증을 시작하면 '몇 주째 쌓였나'가 가장 중요한 숫자가 된다. */
  .acard .weekpill{font-size:22px;font-size:14cqh;font-weight:700;color:var(--mu);
    background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:999px;
    padding:3px 13px;white-space:nowrap;line-height:1;flex:none}
  .acard .weekpill b{color:#fff}

  /* [크리 260711] 이름표를 숫자 '위'가 아니라 '옆'으로 → 세로 한 줄 절약 → 숫자를 크게.
     긴 이름표(누적 확정 수익률)는 두 줄로 자연스럽게 접힌다. */
  .acard .grid4{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
  .acard .cell{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;min-width:0;overflow:hidden}
  .acard .cell .ck{font-size:17px;font-size:11cqh;color:var(--mu);font-weight:600;line-height:1.1;
    flex:0 0 auto;max-width:42%;white-space:normal;word-break:keep-all}
  .acard .cell .cv{font-size:38px;font-size:24cqh;font-weight:700;letter-spacing:-.01em;line-height:1.02;
    white-space:nowrap;flex:1 1 auto;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis}
  /* [크리 260824 S149b] 금액이 길면 잘리지 말고 작아져라.
     '$16,143.40' 처럼 열 글자를 넘으면 cvsm/cvxs 등급이 붙는다. */
  .acard .cell .cv.cvsm{font-size:20cqh;letter-spacing:-.02em}
  .acard .cell .cv.cvxs{font-size:17cqh;letter-spacing:-.03em}
  .zone.real .cell .cv{color:#fff} .zone.demo .cell .cv{color:#C8D6E4}
  .acard .cell .cv.pos{color:var(--up)!important} .acard .cell .cv.neg{color:var(--down)!important} .acard .cell .cv.flat{color:var(--mu)!important}

  .empty{flex:1;min-height:0;container-type:size;padding:10px 16px;border:2.5px dashed rgba(255,194,75,.4);border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:repeating-linear-gradient(45deg,rgba(255,194,75,.04),rgba(255,194,75,.04) 16px,transparent 16px,transparent 32px)}
  .empty .e1{font-size:38px;font-size:27cqh;font-weight:700;color:var(--real);opacity:.9}
  .empty .e2{font-size:18px;font-size:14cqh;font-weight:600;color:var(--mu)}
  .zone.demo .empty{border-color:rgba(120,145,170,.42);
    background:repeating-linear-gradient(45deg,rgba(140,170,200,.045),rgba(140,170,200,.045) 16px,transparent 16px,transparent 32px)}
  .zone.demo .empty .e1{color:var(--demo)}

  .market{background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--hair);border-radius:16px;
    padding:20px 30px;display:flex;flex-direction:column;min-height:0}
  .market .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .market .mh .t{font-size:32px;font-weight:700}
  .market .mh .tf{font-size:18px;color:var(--gold);font-weight:600;border:1px solid rgba(232,182,90,.3);border-radius:8px;padding:4px 11px}
  #mrows{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:9px;margin-top:4px}
  .mrow{display:flex;flex-direction:column;gap:3px;padding:12px 20px;background:rgba(255,255,255,.035);
    border:1px solid var(--hair);border-left:4px solid var(--mu2);border-radius:12px}
  .mrow.up{border-left-color:var(--up)} .mrow.down{border-left-color:var(--down)}
  .mrow .sym{font-size:31px;font-weight:700}
  .mrow .rt{display:flex;align-items:baseline;gap:14px}
  .mrow .px{font-size:31px;font-weight:600} .mrow .ch{font-size:26px;font-weight:700}
  .mrow.up .ch{color:var(--up)} .mrow.down .ch{color:var(--down)} .mrow.flat .ch{color:var(--mu)}

  /* ─── [크리 261019 S951] 전략13호 칸 — 글씨 크기는 다른 칸과 같게 ──────────
     261019 07:4x 전체를 줄였다가 되돌렸고, 07:5x 이 칸만 줄였다가 또 지적받았다
     ("이번에는 너무 작아"). 두 번 다 **엉뚱한 곳을 건드린 것**이다.
     진짜 원인: 이 칸 이름이 "전략13호(눈2개) · Vantage" 로 다른 칸보다 두 단어 길다.
     칸 높이는 다른 칸과 같으니 글씨도 같아야 맞다 → 글씨는 손대지 않고
     ①이름을 다른 칸과 같은 길이로 줄이고 ②알약들만 조금 양보시켜 자리를 만든다. */
  .zone.demo.solo .acard .seedpill,
  .zone.demo.solo .acard .pospill,
  .zone.demo.solo .acard .weekpill{font-size:21px;font-size:13cqh}
  .zone.demo.solo .acard .tag{font-size:15px;font-size:9.6cqh;padding:4px 9px}
  .zone.demo.solo .acard .chead{gap:7px}
  .zone.demo.solo .acard .nm{flex:1 1 60%}
  /* [크리 261019 S941] 솔로 칸(전략13호)은 위 solo 규칙이 더 구체적이라 withsym 을 눌러 버린다.
     실측으로 잡았다 — 솔로 칸만 아직 말줄임이 났다. 그래서 같은 구체성으로 한 단 더 양보시킨다. */
  .zone.demo.solo .acard.withsym .seedpill,
  .zone.demo.solo .acard.withsym .pospill,
  .zone.demo.solo .acard.withsym .weekpill{font-size:18px;font-size:11.4cqh;padding:3px 9px}
  .zone.demo.solo .acard.withsym .chead{gap:6px}
  .zone.demo.solo .acard.withsym .nm{flex:1 1 68%}
</style>

<body>
<div id="fit"><div id="stage">

  <section class="body">

           주인님 지시 "5개씩 두줄로 원래대로 하고 실전만 4개로 묶고 13호는 그대로".
           칸 높이는 오른쪽(5칸)과 같게 flex 4:1 로 나눈다 — 글자는 cqh 라 저절로 맞는다. -->
      <div class="realcol">

</div></div>

<script>
// [크리 260711] 5행 그리드. ROWS 만 바꾸면 행 수 변경(카드 글자는 CSS가 자동 맞춤).
// 네이밍: 실전=신 서열(제우스▸하데스▸포세이돈), 데모=영웅(수련 중).
// [크리 261017 S877] 주인님 지시 "실전 박스를 줄여서 전략13호가 빠져 나오게 해줘 / 오해 소지가 있어서".
//   전략13호는 밴티지 **데모**인데 '실전계좌' 박스 안에 앉아 있어 오해를 샀다(S835 때 데모 칸이 꽉 차서).
//   → 실전 4칸 · 데모 6칸으로 나눈다. 전략13호는 데모 박스로 들어간다.
//   되돌리기: 아래 두 줄을 var ROWS = 5; 로 되돌리고 acc16 을 kind:"real", row:5 로.
var ROWS_REAL = 4;   // 실전 테두리 안
var ROWS_DEMO = 5;   // 오른쪽 — 원래대로

var MAP = {
  acc10: {kind:"real", row:1, label:"제우스 · Vantage"},
  acc09: {kind:"real", row:2, label:"하데스 · Vantage", sym:"GOLD H1\u00b71\ud638\ub1cc"},
  acc02: {kind:"real", row:3, label:"포세이돈 · FxPro"},
  acc14: {kind:"real", row:4, label:"아테나 · Vantage", sym:"GOLD H1\u00b710\ud638\ub1cc"},
  acc06: {kind:"demo", row:1, label:"전략1호 · Vantage", sym:"GOLD H1"},
  acc13: {kind:"demo", row:2, label:"전략9호 · IC Markets", sym:"WTI H1"},
  acc12: {kind:"demo", row:3, label:"전략10호 · Vantage", sym:"GOLD H1"},
  acc11: {kind:"demo", row:4, label:"전략11호 · IC Markets", sym:"NASDAQ D1"},
  acc15: {kind:"demo", row:5, label:"전략12호 · Vantage"},
  // [크리 261016 S835] 주인님 지시 "좌측 실전계좌 맨 아래칸에 새로 넣자".
  //   데모 칸(1~5)은 꽉 차 있고 비어 있는 자리가 real-5 하나뿐이라 거기에 넣는다.
  //   ★실제로는 데모다 — 헷갈리지 않게 라벨에 "데모"를 적어 둔다.
  acc16: {kind:"solo", row:1, label:"전략13호 · Vantage", sym:"GOLD H1"}   // 테두리 밖
};

// 미연결 계좌 자리표시. 지금은 전부 연결됨.
//   예) "real-4": {kind:"real", status:"pending", label:"아테나", sub:"입금 대기"}
var PEND = {
  // [크리 260824 S160] 주인님 지시 — 실전 4번칸에 새 계좌(아테나) 자리를 만든다.
  //   전용 터미널이 아직 없어 숫자를 못 읽는다. 터미널이 붙고 accounts.json 에
  //   등록되면 이 항목을 지우고 MAP 에 {kind:"real", row:4} 로 옮긴다.
};

var DEMO = {accounts:[
  {acc:"acc10", seed:500,   equity:500.00,   balance:500.00,  positions:0, days:3},
  {acc:"acc09", seed:3000,  equity:2436.16,  balance:2471.28, positions:7, days:5},
  {acc:"acc14", seed:2000,  equity:2000.00,  balance:2000.00, positions:0, days:1},
  {acc:"acc02", seed:58,    equity:97.05,    balance:98.60,   positions:2, days:6},
  {acc:"acc06", seed:10000, equity:16831.85, balance:16465.79,positions:6, days:8},
  {acc:"acc13", seed:3000,  equity:2987.87,  balance:2987.87, positions:0, days:1},
  {acc:"acc12", seed:3000,  equity:2995.16,  balance:2995.16, positions:0, days:1},
  {acc:"acc11", seed:2000,  equity:2034.00,  balance:2034.00, positions:0, days:1},
  {acc:"acc15", seed:2000,  equity:2000.00,  balance:2000.00, positions:0, days:1},
  {acc:"acc16", seed:2500,  equity:2500.00,  balance:2500.00, positions:0, days:1}
], brief:[
  {name:"BITCOIN", price:62971.65, pct:-2.22, digits:2},
  {name:"GOLD",    price:4310.40,  pct:-0.15, digits:2},
  {name:"WTI",     price:90.893,   pct:2.68,  digits:3},
  {name:"NASDAQ",  price:28969.45, pct:-2.51, digits:2},
  {name:"HANGSENG",price:24608.00, pct:-2.40, digits:2}
]};

function $(s){ return document.querySelector(s); }
function fmt(n,d){ if(d===undefined) d=2;
  return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d}); }
function sgn(n){ return n>0?'+':(n<0?'−':''); }
function cls(n){ return n>0?'pos':(n<0?'neg':'flat'); }
function arr(n){ return n>0?'▲':(n<0?'▼':'■'); }

/* [크리 260824 S149b] 금액 한 칸. 길면 글자 등급을 낮춰 '...' 로 잘리는 걸 막는다. */
function money(v){
  var s = '$' + fmt(v);
  /* 실측: '$2,253.94'=9  '$16,143.40'=10  '$123,456.78'=11.
     화면에서 잘린 건 10글자부터였다. 그 자리에서 등급을 낮춘다. */
  var g = s.length >= 11 ? ' cvxs' : (s.length >= 10 ? ' cvsm' : '');
  return '<div class="cv mono notranslate' + g + '" translate="no">' + s + '</div>';
}

function card(a){
  if(!a){
    return '<div class="empty"><div class="e1">— 빈 슬롯 —</div><div class="e2">계좌 배정 대기</div></div>';
  }
  if(a.status === 'pending'){
    return '<div class="empty"><div class="e1">'+a.label+'</div><div class="e2">'+(a.sub||'연결 준비중')+'</div></div>';
  }
  var seed = +a.seed || 0, bal = +a.balance || 0, eq = +a.equity || 0;
  var rp = seed ? (bal-seed)/seed*100 : 0;   // 확정 수익률 = (잔고-시드)/시드
  var vp = seed ? (eq -seed)/seed*100 : 0;   // 평가 수익률 = (평가-시드)/시드
  // [크리 261017 S874] demoLook 이면 자리는 실전 칸이어도 '모의'로 보인다
  var asDemo = !!a.demoLook;
  var tag = (a.kind === 'real' && !asDemo) ? '⚡ 실전' : '🧪 모의';
  // [크리 260713] 계좌명과 시드 사이에 '현재 보유 포지션 수' 실시간 표시.
  //   0개면 조용히(muted), 1개 이상이면 강조(on) — 한눈에 노출 상태가 보이게.
  var pos = (a.positions === undefined || a.positions === null) ? 0 : (+a.positions);
  var posCls = pos > 0 ? 'pospill on' : 'pospill';
  // [크리 261019 S942] 주인님 지시 — 주차를 **일수**로 바꿨다. 거래일이 아니라 달력 날짜 더하기.
  //   서버(dash_server._day_no)가 (오늘−시작일)+1 로 매일 자동 계산한다.
  //   시작일은 config/strategy_start.json — 전략을 바꾸면 거기 날짜만 새로 찍으면 리셋.
  var wk = (a.days === undefined || a.days === null) ? null : (+a.days);
  var wkHtml = (wk === null) ? ''
    : '<span class="weekpill mono"><b>'+wk+'</b>일차</span>';
  return '<div class="acard'+(asDemo?' asdemo':'')+(a.hasSym?' withsym':'')+'"><div class="accent"></div><div class="cin">'
    + '<div class="chead">'
    +   '<div class="nm"><span class="name">'+a.label+'</span></div>'
    +   wkHtml
    +   '<span class="'+posCls+' mono">포지션 <b>'+pos+'</b></span>'
    +   '<span class="seedpill mono">시드 <b>$'+fmt(seed,0)+'</b></span>'
    + '</div>'
    + '<div class="grid4">'
    +   '<div class="cell"><div class="ck">현재 잔고</div>'+money(bal)+'</div>'
    +   '<div class="cell"><div class="ck">평가 잔고</div>'+money(eq)+'</div>'
    +   '<div class="cell"><div class="ck">누적 확정 수익률</div><div class="cv mono '+cls(rp)+'">'+sgn(rp)+fmt(Math.abs(rp))+'%</div></div>'
    +   '<div class="cell"><div class="ck">누적 평가 수익률</div><div class="cv mono '+cls(vp)+'">'+sgn(vp)+fmt(Math.abs(vp))+'%</div></div>'
    + '</div>'
    + '</div></div>';
}

function render(d){
  /* [크리 260818] 눈썹줄의 '데이터 08-05 10:20 (스냅샷)' 은 HTML 에 박아둔
     죽은 글자였다. 자료가 며칠 멈춰도 화면은 그대로라 거짓말을 한다.
     실제 수신 시각을 그려주고, 대체표시로 떨어지면 그렇다고 말하게 한다. */
  try{
    var eb = document.getElementById('eyeb');
    if(eb){
      if(d && d.__stale){ eb.textContent = ' · 서버 응답 없음 ' + d.__stale
            + '회 — 마지막 정상 자료를 그대로 두고 있습니다';
          eb.style.color = '#FFC24B'; }
      else if(d && d.__waiting){ eb.textContent = ' · 서버 연결 대기 ' + d.__waiting + '회';
          eb.style.color = '#FF6B6B'; }
      else if(d && d.__demo){ eb.textContent = ' · 미리보기(가짜 자료) — ?demo=1';
          eb.style.color = '#FF6B6B'; }
      else if(d && d.updated_at){
        var t = new Date(String(d.updated_at).replace(' ','T'));
        var mi = Math.floor((Date.now() - t.getTime())/60000);
        var hh = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
        var mm = String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
        eb.textContent = ' · 자료 ' + mm + ' ' + hh + ' KST' + (mi > 30 ? ' (' + mi + '분 지연)' : '');
        eb.style.color = mi > 30 ? '#FF6B6B' : '';
      } else { eb.textContent = ''; eb.style.color = ''; }
    }
  }catch(e){}
  var cells = {};
  (d.accounts || []).forEach(function(a){
    var m = MAP[a.acc];
    if(!m) return;
    // [크리 260922 S268] 브로커명은 accounts.json 이 정본이다. MAP 라벨은 별명만 쓰고
    //   ' \u00b7 브로커' 는 받은 자료의 broker 값으로 붙인다.
    //   이렇게 해두면 계좌를 옮겨도 깃허브에 다시 올릴 필요가 없다.
    var nick = String(m.label).split(' \u00b7 ')[0];
    // [크리 261019 S941] 1종목만 도는 전략은 별명과 브로커 사이에 종목을 끼운다(MAP 의 sym).
    var sy   = m.sym ? ('<i class="syml">\u00b7 ' + m.sym + '</i>') : '';
    var bk   = a.broker ? ('<i class="brk">\u00b7 ' + a.broker + '</i>') : '';
    var lab  = (a.broker || m.sym) ? (nick + ' ' + sy + ' ' + bk) : m.label;
    cells[m.kind+'-'+m.row] = Object.assign({}, a, {label:lab, kind:m.kind, status:'live',
                                                     hasSym: !!m.sym,            // [S941] 종목 붙은 칸
                                                     demoLook: !!m.demoLook});   // [S874]
  });
  var R = '', M = '';
  for(var r = 1; r <= ROWS_REAL; r++){ R += card(cells['real-'+r] || PEND['real-'+r] || null); }
  for(var r = 1; r <= ROWS_DEMO; r++){ M += card(cells['demo-'+r] || PEND['demo-'+r] || null); }
  var O = $('#outCards'); if(O){ O.innerHTML = card(cells['solo-1'] || null); }   // [S878]
  $('#realCards').innerHTML = R;
  $('#demoCards').innerHTML = M;

  var m = $('#mrows');
  m.innerHTML = '';
  (d.brief || []).forEach(function(s){
    var row = document.createElement('div');
    row.className = 'mrow notranslate ' + cls(s.pct);
    row.setAttribute('translate','no');
    row.innerHTML = '<span class="sym">'+s.name+'</span>'
      + '<span class="rt"><span class="px mono">'+fmt(s.price, (s.digits===undefined?2:s.digits))+'</span>'
      + '<span class="ch mono">'+arr(s.pct)+' '+sgn(s.pct)+fmt(Math.abs(s.pct))+'%</span></span>';
    m.appendChild(row);
  });
}

var WD = ['일','월','화','수','목','금','토'];
function tick(){
  var n = new Date();
  var k = new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000);
  $('#clock').textContent = [k.getHours(), k.getMinutes(), k.getSeconds()]
    .map(function(x){ return String(x).padStart(2,'0'); }).join(':');
  try{ var _s0 = new Date(2026, 5, 11);                       // 첫 가동일 2026-06-11 [실측: dash 폴더 최초 파일]
       var _k0 = new Date(k.getFullYear(), k.getMonth(), k.getDate());
       var _dc = Math.floor((_k0 - _s0) / 86400000) + 1;
       var _de = document.getElementById('daycnt'); if(_de) _de.innerHTML = '<span class="since">2026.06.11 부터</span>' + _dc + '일째'; }catch(e){}
  $('#date').textContent = k.getFullYear() + '-'
    + String(k.getMonth()+1).padStart(2,'0') + '-'
    + String(k.getDate()).padStart(2,'0') + ' (' + WD[k.getDay()] + ')';
}

/* [크리 260824 S149] 실패해도 가짜 자료를 그리지 않는다.
   전: .catch(...) 에서 HTML 에 박아둔 DEMO 를 그렸다. 3초마다 성공/실패가
       갈리면 진짜값($2,253)과 가짜값($2,000)이 번갈아 나와 화면이 흔들린다.
       방송판에 가짜 숫자를 진짜인 척 띄우는 것 자체가 사고다.
   후: 마지막 정상 자료를 유지하고, 눈썹줄에 몇 번 실패했는지 정직하게 적는다. */
var LAST = null, FAILS = 0;
var DEMO_MODE = (location.search.indexOf('demo=1') >= 0);
function poll(){
  fetch('/api/state', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ if(!d.accounts || !d.accounts.length) throw 0;
                       LAST = d; FAILS = 0; render(d); })
    .catch(function(){
      FAILS++;
      if(LAST){ render(Object.assign({}, LAST, {__stale:FAILS})); return; }
      if(DEMO_MODE){ render(Object.assign({}, DEMO, {__demo:1})); return; }
      render({accounts:[], brief:[], __waiting:FAILS});
    });
}

function fit(){
  var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}

window.addEventListener('resize', fit);
fit();
tick();
setInterval(tick, 1000);
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
